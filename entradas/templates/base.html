<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block titulo %}
        <title>Diario Personal</title>
    {% endblock %}

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        color: #29233a;
        min-height: 100vh;

        background:
            radial-gradient(circle at 15% 20%, rgba(255, 73, 196, 0.45), transparent 35%),
            radial-gradient(circle at 85% 75%, rgba(54, 210, 255, 0.45), transparent 35%),
            linear-gradient(135deg, #5424b8, #9d35d8, #ef4ca6);
    }

    header {
        height: 75px;
        display: flex;
        align-items: center;
        padding: 0 45px;

        background: rgba(65, 29, 120, 0.55);
        color: white;
        backdrop-filter: blur(10px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    header h1 {
        font-size: 1.5rem;
    }

    main {
        min-height: calc(100vh - 75px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 45px 20px;
    }

    .contenedor {
        width: 100%;
        max-width: 900px;

        padding: 45px;

        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 22px;

        box-shadow: 0 15px 45px rgba(51, 20, 91, 0.25);

        text-align: center;
    }

    .icono-principal {
        font-size: 3.5rem;
        margin-bottom: 12px;
    }

    .contenedor h2 {
        font-size: 2.2rem;
        margin-bottom: 15px;
    }

    .contenedor h2 span {
        background: linear-gradient(90deg, #7047eb, #e83ca5, #2ebeea);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .subtitulo {
        max-width: 600px;
        margin: 0 auto 35px;
        line-height: 1.6;
        color: #625b70;
    }

    .opciones {
        display: flex;
        gap: 20px;
        margin: 30px 0;
    }

    .opcion {
        flex: 1;
        padding: 25px 18px;

        background: linear-gradient(
            145deg,
            rgba(244, 232, 255, 0.9),
            rgba(230, 247, 255, 0.9)
        );

        border: 1px solid #e7d8ff;
        border-radius: 16px;

        transition: transform 0.2s, box-shadow 0.2s;
    }

    .opcion:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(113, 71, 235, 0.15);
    }

    .opcion .icono {
        font-size: 2rem;
        margin-bottom: 12px;
    }

    .opcion h3 {
        margin-bottom: 8px;
        color: #6335b5;
    }

    .opcion p {
        color: #686071;
        line-height: 1.5;
        font-size: 0.95rem;
    }

    .boton {
        display: inline-block;
        margin-top: 10px;
        padding: 14px 28px;

        background: linear-gradient(90deg, #7147eb, #e83ca5, #29bde8);

        color: white;
        text-decoration: none;
        font-weight: bold;

        border-radius: 30px;

        box-shadow: 0 7px 18px rgba(150, 50, 190, 0.3);

        transition: transform 0.2s;
    }

    .boton:hover {
        transform: translateY(-2px);
    }

    .error-codigo {
        font-size: 5rem;
        font-weight: bold;

        background: linear-gradient(90deg, #7147eb, #e83ca5, #29bde8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        margin-bottom: 10px;
    }

    @media (max-width: 700px) {
        .opciones {
            flex-direction: column;
        }

        .contenedor {
            padding: 30px 20px;
        }

        header {
            padding: 0 20px;
        }
    }
    </style>
</head>

<body>

    <header>
        <h1>Diario Personal</h1>
    </header>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

</body>
</html>
